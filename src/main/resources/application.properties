spring.application.name=Sunoza
youtube.api.key=${YOUTUBE_API_KEY:}
youtube.api.base-url=https://www.googleapis.com/youtube/v3

# PostgreSQL database. Create SunozaApp in PostgreSQL before starting the backend.
spring.datasource.url=jdbc:postgresql://localhost:5432/SunozaApp
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Provide a random secret of at least 32 bytes in production.
app.jwt.secret=8ubzLLAO5cd74hNOmfZYMoOdcJjcL4vloZaIRkBpocA=
app.jwt.expiration-ms=18000000
app.password-reset.frontend-url=${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
app.mail.from=${MAIL_FROM:no-reply@sunoza.local}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
